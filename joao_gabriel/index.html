                  photo.classList.remove("fade-in");
                  photo.classList.add("fade-out");
 
                  // Só mostra ícone depois do fade
                  setTimeout(() =>
                     {
                      if (photo.classList.contains("fade-out"))
                         {
                          photoIcon.classList.add("visible");
                         }
                     }, 3000);  // Tempo do fade
                 }
             }

          let segmentoAtual = -1;

          function verificarSegmento()
             {
              if (!player || player.getCurrentTime === undefined) return;

              const tempo = player.getCurrentTime();
              let encontrado = false;

              for (let i = 0; i < segments.length; i++)
                 {
                  const seg = segments[i];

                  if (tempo >= seg.start && tempo < seg.end)
                     {
                      if (segmentoAtual !== i)
                         {
                          segmentoAtual = i;
                          aplicarModo(seg.mode);
                         }

                      encontrado = true;
                      break;
                     }
                 }

              // Se vídeo passar do último segmento → continua mostrando último estado
              if (!encontrado && segmentoAtual !== -1)
                 {
                  // Mantém o último modo ativo
                 }

              requestAnimationFrame(verificarSegmento);
             }

          verificarSegmento();
         }
</script>
